name: Feature request
description: Propose a focused improvement or integration.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or user need
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Security and permission impact
      description: Explain any new filesystem, shell, browser, network, or credential access.
    validations:
      required: true
